[project]
name = "financial-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
  # tests read submitted CSVs with pandas
  "pandas>=2",
  "pytest>=8,<9",
  "sentencepiece>=0.2",
  "torch>=2.6",
  "transformers>=4.48",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# makes `import vifinqa` work from scripts, tests, and notebooks
[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["docs"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
